<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="description" content="Caso econômico do curso de maestria em TAPP Hernia3D: quanto custa, quanto evita, e para quem. Rodada 3 das premissas.">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caso Econômico Hernia3D</title>
<meta name="publicacao" content="13|2026-11-06">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400;1,8..60,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Caso econômico Hernia3D, no molde da Sistemática (03/11/2026)
   Seis abas, uma tela cada, sem rolagem no desktop: a conta abre pela leitura (a decisão, a resposta, um número por
   razão, o que falta saber), e cada número sublinhado abre a sua conta na coluna da direita.
   A conta é por matrícula: só 80% chegam à maestria, e quem não chega também paga.
   Cores: vermelho, o que pesa (a curva de hoje, o que quem compra paga, o que falta, a agenda estourada); ouro, o curso;
   verde, a economia e a sobra; tinta, o resto, inclusive o ponto de hoje nas sensibilidades.
   Abaixo de 1180px a página empilha e rola; até 767px, a versão do celular.
   ============================================================ */
:root{
  --papel:#FAF8F3; --tinta:#0C325A; --primary:#14477A; --ouro:#B8860B; --ouro-texto:#8A6508; --ouro-claro:#F6EDD8;
  --risco:#B3261E; --ok:#2E6B3E; --tinta-clara:#E3EAF2;
  --filete:#DCD6C8; --filete-forte:#BDB5A3; --cinza:#6B6A64; --cinza-escuro:#45443F; --texto:#1F1F1D;
  --font:"Inter","Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,sans-serif;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --header:56px; color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--papel);color:var(--texto);line-height:1.5;overflow:hidden;-webkit-font-smoothing:antialiased;font-size:14px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
ul{list-style:none}
a:focus-visible,button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--ouro);outline-offset:2px}
.leitura :focus-visible,.painel :focus-visible{outline-offset:-2px}
.so-leitor{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

/* ---- a barra: a marca, as abas como pílulas e as outras duas peças (a mesma barra da Sistemática) ---- */
nav.barra{position:sticky;top:0;z-index:50;min-height:var(--header);display:flex;align-items:center;gap:18px;padding:6px 22px;background:var(--papel);border-bottom:1px solid var(--filete-forte)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--tinta);flex-shrink:0}
.brand-mark{width:34px;height:34px;border-radius:6px;background:var(--ouro);color:var(--tinta);font-family:var(--serif);font-weight:700;font-size:14px;letter-spacing:-.02em;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.wm-nome{display:flex;flex-direction:column;font-family:var(--serif);font-size:18px;font-weight:600;line-height:1.05;letter-spacing:-.01em}
.wm-nome small{font-family:var(--font);font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--cinza);margin-top:3px}
.nav-links{flex:1 1 auto;min-width:0;display:flex;flex-wrap:wrap;align-items:center;justify-content:safe center;gap:2px}
.nav-links.duas{display:grid;grid-template-columns:repeat(3,auto);justify-content:safe center;gap:2px 4px}
.f-aba{font-size:11.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--cinza);border:1px solid transparent;border-radius:999px;padding:6px 12px;white-space:nowrap}
.f-aba small{font-family:var(--serif);font-style:italic;font-size:12px;font-weight:500;color:var(--ouro-texto);margin-right:6px;letter-spacing:0;text-transform:none}
.f-aba:hover{color:var(--tinta);border-color:var(--filete-forte)}
.f-aba.on{background:var(--tinta);border-color:var(--tinta);color:#fff}
.f-aba.on small{color:#E8C66A}
/* a triangulação: cada peça aponta para as outras duas, numa pílula só, a mesma da Sistemática e da plataforma */
.pecas{display:inline-flex;align-items:center;gap:2px;padding:3px 4px 3px 5px;border:1px solid var(--filete-forte);border-radius:999px;background:rgba(255,255,255,.6);font-size:12.5px;white-space:nowrap;flex-shrink:0}
.pecas a{color:var(--tinta);font-weight:600;text-decoration:none;padding:4px 8px;border-radius:999px}
.pecas a:hover{background:#fff;text-decoration:underline;text-underline-offset:3px}
.irma-mark{width:24px;height:24px;border-radius:5px;background:var(--ouro);color:var(--tinta);font-family:var(--serif);font-weight:700;font-size:10px;display:flex;align-items:center;justify-content:center}
@media (max-width:1440px){.pecas{padding:3px}.pecas .irma-mark{display:none}.pecas a{padding:4px 7px;font-size:12px}}
@media (max-width:1360px){.f-aba{padding:5px 9px;letter-spacing:.12em;font-size:11px}.f-aba small{margin-right:4px}}
@media (prefers-reduced-motion:no-preference){.f-aba,.pecas a{transition:color .15s,background .15s,border-color .15s}}

/* ---- o palco: a altura exata da tela ---- */
.palco{display:flex;flex-direction:column;padding:10px 24px 6px;max-width:1800px;margin:0 auto}
.pergunta{flex:0 0 auto;margin:0 0 4px;font-family:var(--serif);font-style:italic;font-size:14.5px;font-weight:400;color:var(--cinza-escuro)}
.pergunta b{font-family:var(--font);font-style:normal;font-size:11.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--tinta);margin-right:4px}
.manchete{flex:0 0 auto;margin:0 0 10px;font-family:var(--serif);font-size:19px;font-weight:600;line-height:1.3;color:var(--tinta);max-width:120ch}
.manchete:empty{display:none}
.vistas{flex:1 1 auto;min-height:0}
.vista{display:none;height:100%}
.vista.on{display:grid}
.v-capa.on{display:block}
.v-dupla.on{grid-template-columns:minmax(0,1fr) minmax(300px,30%);gap:30px}
.painel,.leitura{min-height:0;height:100%;overflow:hidden}
.painel.rola,.leitura.rola{overflow:auto}
.leitura{border-left:1px solid var(--filete);padding-left:24px}

/* ---- o que se repete nas abas ---- */
.rot{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--cinza-escuro);margin:0 0 8px}
.sec{margin-bottom:22px}
.sec:last-child{margin-bottom:0}
.nota{font-size:12.5px;font-style:italic;color:var(--cinza);margin-top:8px}
/* um número que abre a sua conta: sublinhado pontilhado, como na Sistemática */
.n-ver{text-decoration:underline dotted 1.5px;text-underline-offset:4px;text-decoration-color:var(--filete-forte)}
.n-ver:hover{text-decoration-style:solid;text-decoration-color:currentColor}
.n-ver.on{background:var(--ouro-claro);border-radius:4px;box-shadow:0 0 0 3px var(--ouro-claro)}
/* a procedência, em itálico, como na Sistemática; e o ponto, nas listas */
.pr{font-family:var(--serif);font-style:italic;font-weight:500;white-space:nowrap}
.pr.fonte{color:var(--ok)} .pr.hip{color:var(--ouro-texto)} .pr.dec{color:var(--ouro-texto);text-decoration:underline dashed 1px;text-underline-offset:3px} .pr.falta{color:var(--risco);text-decoration:underline dashed 1px;text-underline-offset:3px} .pr.res{color:var(--cinza)}
.pt{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none}
.pt.fonte{background:var(--ok)} .pt.hip{background:var(--ouro)} .pt.dec{border:1.5px dashed var(--ouro-texto)} .pt.falta{border:1.5px dashed var(--risco)} .pt.res{background:var(--filete-forte)}

/* ---- 00 · a leitura: a decisão, a resposta, três números e o que falta saber ---- */
.capa{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:56px;align-items:start;padding:6px 0 4px}
.kicker{font-family:var(--serif);font-style:italic;font-size:14px;color:var(--cinza-escuro);margin-bottom:8px}
.capa-q{font-family:var(--serif);font-size:32px;font-weight:600;line-height:1.15;color:var(--tinta);margin-bottom:14px}
.capa-r{font-family:var(--serif);font-size:19.5px;line-height:1.5;color:var(--texto)}
.capa-r b{font-weight:700;color:var(--tinta)}
.capa-bt{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:center;margin-top:20px}
.bt-solido{background:var(--tinta);color:#fff;border-radius:4px;padding:10px 16px;font-weight:600;font-size:14px}
.bt-solido:hover{background:var(--primary)}
.bt-texto{color:var(--tinta);font-weight:500;font-size:14px;padding:6px 0;border-bottom:1px solid var(--filete-forte)}
.bt-texto:hover{border-bottom-color:var(--tinta)}
.tres{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;border-top:1px solid var(--filete-forte);padding-top:14px;margin-bottom:22px}
.tres button{display:flex;flex-direction:column;justify-content:flex-start;border-bottom:1px solid var(--filete);padding-bottom:12px}
.tres b{display:block;font-family:var(--serif);font-size:34px;font-weight:600;line-height:1.05;color:var(--tinta)}
.tres button:hover b{text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:1px}
.tres .t{display:block;font-size:13px;font-weight:600;line-height:1.3;color:var(--texto);margin-top:6px}
.tres .s{display:block;font-size:12px;line-height:1.4;color:var(--cinza);margin-top:4px}
.faltas{border-top:1px solid var(--filete-forte)}
.faltas button{display:block;width:100%;padding:10px 0;border-bottom:1px solid var(--filete)}
.faltas b{display:block;font-family:var(--serif);font-size:16.5px;font-weight:600;color:var(--tinta)}
.faltas span{display:block;font-size:13px;color:var(--cinza-escuro)}
.faltas button:hover b{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}

/* ---- 01 · o residente: hoje e com o curso, e a conta de cada complicação evitada ---- */
.comp{display:grid;grid-template-columns:200px minmax(0,1fr);gap:10px 16px;align-items:center}
.comp-rot{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;line-height:1.3}
.comp-rot small{display:block;font-size:12px;font-weight:400;letter-spacing:0;text-transform:none;color:var(--cinza-escuro)}
.comp-rot.hoje{color:var(--risco)} .comp-rot.com{color:var(--ouro-texto)}
.trilho{display:flex;align-items:center;gap:14px}
.trilho > div:last-child{display:flex;align-items:center;gap:10px}
.trilho small{font-size:12.5px;line-height:1.3;color:var(--cinza-escuro)}
.barra-h{height:40px;border-radius:5px;flex:none}
.barra-h.hoje{background:var(--risco)} .barra-h.com{background:var(--ouro)}
.trilho .v{font-family:var(--serif);font-size:30px;font-weight:600;line-height:1;white-space:nowrap}
.v.hoje{color:var(--risco)} .v.com{color:var(--ouro-texto)}
.evita{grid-column:2;font-size:14px;color:var(--ok);font-weight:600;border-top:1px dashed var(--filete-forte);padding-top:8px}
.evita b{font-family:var(--serif);font-size:20px}
.equacao{display:flex;align-items:stretch;gap:14px;flex-wrap:wrap}
.eq-b{flex:1 1 0;min-width:150px;background:#fff;border:1px solid var(--filete);border-radius:10px;padding:12px 16px}
.eq-b.res{border-color:var(--tinta);background:var(--tinta-clara)}
.eq-b b{display:block;font-family:var(--serif);font-size:32px;font-weight:600;line-height:1.1;color:var(--tinta)}
.eq-b span{display:block;font-size:12.5px;color:var(--cinza-escuro);margin-top:4px}
.eq-op{display:flex;align-items:center;font-family:var(--serif);font-size:32px;color:var(--cinza)}

/* ---- 02 · quem paga: o saldo de cada ator em três custos de complicação ---- */
.cen{display:grid;grid-template-columns:210px minmax(0,1fr) 170px;gap:10px 16px;align-items:center}
.cen-nome b{display:block;font-size:13.5px;color:var(--texto)}
.cen-nome span{display:block;font-size:12px;color:var(--cinza)}
.div{display:grid;align-items:center;position:relative}
.div::after{content:"";position:absolute;top:-6px;bottom:-6px;width:1px;background:var(--cinza);left:var(--zero)}
.div .esq{display:flex;justify-content:flex-end}
.div .dir{display:flex;justify-content:flex-start;align-items:center;gap:6px}
/* as barras são proporcionais ao valor; o rótulo fica dentro quando cabe, e fora (ao lado) quando a barra é curta */
.bar{height:30px;border-radius:4px;display:flex;align-items:center;padding:0 8px;font-size:12px;font-weight:600;color:#fff;white-space:nowrap;min-width:0;overflow:hidden}
.bar.paga{background:var(--risco);justify-content:flex-start}
.bar.ganha{background:var(--ok);justify-content:flex-end}
.bar-v{font-size:12px;font-weight:600;color:var(--ok);white-space:nowrap}
.saldo b{display:block;font-family:var(--serif);font-size:19px;font-weight:600;line-height:1.15}
.saldo span{display:block;font-size:12px;color:var(--cinza)}
.saldo.neg b{color:var(--risco)} .saldo.zero b{color:var(--tinta)} .saldo.pos b{color:var(--ok)}
.leg{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12.5px;color:var(--cinza-escuro);margin-top:12px}
.leg i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:6px}
.reemb li{font-size:13.5px;padding:6px 0;border-bottom:1px solid var(--filete)}
.reemb li b{font-weight:600;color:var(--tinta)}
.reemb .abaixo{color:var(--risco);font-weight:600} .reemb .acima{color:var(--ok);font-weight:600}

/* ---- 03 · a empresa: para onde vai o preço ---- */
.pilhas{display:grid;grid-template-columns:150px minmax(0,1fr) 110px;gap:12px 16px;align-items:center}
.pilha-nome b{display:block;font-size:13.5px}
.pilha-nome span{display:block;font-size:12px;color:var(--cinza)}
.pilha{display:flex;height:46px;border-radius:5px;overflow:hidden}
.seg{display:flex;align-items:center;justify-content:center;min-width:0;overflow:hidden;font-size:12px;font-weight:600;white-space:nowrap;color:#fff;border-right:2px solid var(--papel)}
.seg:last-child{border-right:0}
.seg.direto{background:var(--tinta)} .seg.prec{background:var(--primary)} .seg.opex{background:var(--filete-forte);color:var(--texto)} .seg.imp{background:var(--filete);color:var(--texto)} .seg.lucro{background:var(--ok)}
.seg.fora,.seg.opex.fora,.seg.imp.fora{color:transparent}
button.seg:hover{filter:brightness(1.12)}
.seg.on{box-shadow:inset 0 0 0 2px #fff,inset 0 0 0 4px var(--tinta)}
.pilha .seg:focus-visible{outline:2px solid #fff;outline-offset:-3px;box-shadow:inset 0 0 0 5px var(--tinta)}
.marg b{display:block;font-family:var(--serif);font-size:24px;font-weight:600;color:var(--ok);line-height:1.1}
.marg span{display:block;font-size:12px;color:var(--cinza)}
.leg .direto{background:var(--tinta)} .leg .prec{background:var(--primary)} .leg .opex{background:var(--filete-forte)} .leg .imp{background:var(--filete)} .leg .lucro{background:var(--ok)} .leg .paga{background:var(--risco)} .leg .ganha{background:var(--ok)} .leg .passa{background:var(--risco)}
.colunas{display:flex;align-items:flex-end;gap:12px;height:150px;border-bottom:1px solid var(--filete-forte);padding:0 4px}
.col{flex:1 1 0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.col .cv{font-size:12.5px;font-weight:600;color:var(--cinza-escuro);margin-bottom:4px;white-space:nowrap}
.col .cb{width:100%;max-width:70px;background:var(--filete-forte);border-radius:4px 4px 0 0}
.col.hoje .cb{background:var(--tinta)} .col.hoje .cv{color:var(--tinta)}
.col-rot{display:flex;gap:12px;padding:6px 4px 0}
.col-rot span{flex:1 1 0;text-align:center;font-size:12px;color:var(--cinza-escuro);min-width:0}
.col-rot span.hoje{color:var(--tinta);font-weight:700}
.linha-eq{font-size:14px;color:var(--texto);margin-top:12px}
.linha-eq b{font-family:var(--serif);font-size:20px;color:var(--tinta)}

/* ---- 04 · a escala: do país à turma, e o que limita ---- */
.funil{display:flex;align-items:stretch;gap:8px}
.f-passo{flex:1 1 0;min-width:0;border-top:3px solid var(--tinta);background:#fff;border-radius:0 0 8px 8px;padding:10px 12px 12px;display:block}
.f-passo.cap{border-top-color:var(--ouro)} .f-passo.ok{border-top-color:var(--ok)}
.f-passo b{display:block;font-family:var(--serif);font-size:30px;font-weight:600;line-height:1.05;color:var(--tinta);white-space:nowrap}
.f-passo.ok b{color:var(--ok)}
.f-passo span{display:block;font-size:12.5px;line-height:1.35;color:var(--cinza-escuro);margin-top:4px}
.f-passo:hover,.f-passo.on{background:var(--ouro-claro)}
.f-seta{display:flex;align-items:center;color:var(--filete-forte);font-size:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:12px;font-size:13.5px;color:var(--cinza-escuro)}
.chips b{font-family:var(--serif);font-size:17px;color:var(--tinta)}
.proj .colunas{height:160px;position:relative}
.proj .col{position:relative;z-index:1}
.proj .col .cv{background:var(--papel);padding:0 4px;border-radius:3px}
.proj .col .cb{background:var(--ouro)}
.proj .col.passa .cb{background:var(--risco)} .proj .col.passa .cv{color:var(--risco)}
/* a linha da agenda de hoje passa por trás das colunas; o rótulo de cada coluna fica por cima dela */
.agenda{position:absolute;left:0;right:0;border-top:2px dashed var(--tinta)}
.leg .agenda-leg{width:22px;height:0;border-top:2px dashed var(--tinta);border-radius:0;vertical-align:4px;background:none}

/* ---- 05 · as premissas: quatro colunas, um ponto de procedência por linha ---- */
.premissas{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0 22px;align-items:start}
.grupo{margin-bottom:12px}
.grupo h4{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--tinta);border-bottom:1px solid var(--filete-forte);padding-bottom:5px;margin-bottom:2px}
.prem{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;width:100%;padding:4px;border-bottom:1px solid var(--filete);font-size:12.5px;line-height:1.3;border-radius:3px}
.prem:hover{background:#fff}
.prem.on{background:var(--ouro-claro)}
.prem .pv{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--tinta)}

/* ---- a leitura e as fichas, na coluna da direita ---- */
.bloco{padding-bottom:12px;margin-bottom:12px;border-bottom:1px solid var(--filete)}
.bloco:last-of-type{border-bottom:0}
.leitura p{font-size:13.5px;line-height:1.5;margin-bottom:6px}
.leitura .rot{font-size:11px;line-height:1.3;margin:0 0 8px}
.leitura .achado{font-family:var(--serif);font-size:17px;font-weight:600;line-height:1.35;color:var(--tinta);margin-bottom:8px}
.leitura .dica{font-size:12.5px;font-style:italic;color:var(--cinza)}
.l-elo{display:block;margin-top:10px;font-family:var(--serif);font-style:italic;font-size:15px;color:var(--primary)}
.l-elo:hover{text-decoration:underline}
.volta{font-size:13px;color:var(--primary);margin-bottom:10px}
.volta:hover{text-decoration:underline}
.ficha h3{font-family:var(--serif);font-size:18px;font-weight:600;line-height:1.25;color:var(--tinta)}
.leitura .f-valor{font-family:var(--serif);font-size:24px;font-weight:600;color:var(--tinta);line-height:1.2;margin:2px 0 4px}
.leitura .ficha .rot{margin:10px 0 3px}
.leitura .f-val{font-size:13px;line-height:1.45;margin-bottom:3px}
.f-val b{color:var(--tinta)}
.leitura .f-ressalva{border-left:3px solid var(--ouro);padding-left:10px;font-size:13px;line-height:1.45;color:var(--cinza-escuro);margin-top:10px}
.leitura .f-vem{display:flex;flex-wrap:wrap;gap:2px 14px;font-size:12.5px;line-height:1.4;margin:0}
.f-vem button{display:inline-flex;align-items:center;gap:6px;color:var(--primary)}
.f-vem button:hover{text-decoration:underline}
.leitura .f-st{font-size:12.5px;color:var(--cinza-escuro)}
.leitura .f-texto{font-size:13px;line-height:1.45;color:var(--texto)}
.leitura .f-livro{font-size:12px;color:var(--cinza);margin-top:8px}
.mais{font-size:12.5px;color:var(--primary);text-decoration:underline dotted;text-underline-offset:3px}
.sens{width:100%;border-collapse:collapse;font-size:12.5px;line-height:1.3}
.sens th{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--cinza);text-align:right;padding:2px 6px;border-bottom:1px solid var(--filete-forte)}
.sens th:first-child,.sens td:first-child{text-align:left}
.sens td{text-align:right;padding:2px 6px;border-bottom:1px solid var(--filete);font-variant-numeric:tabular-nums;white-space:nowrap}
.sens tr.hoje td{font-weight:700;color:var(--tinta);background:var(--tinta-clara)}
.sens td.neg{color:var(--risco)} .sens td.pos{color:var(--ok)}

/* ---- a legenda e o carimbo, no pé ---- */
.legenda{flex:0 0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:4px 16px;margin-top:8px;padding-top:6px;border-top:1px solid var(--filete);font-size:11.5px;color:var(--cinza-escuro)}
.legenda > span{display:inline-flex;align-items:center;gap:5px}
.carimbo{margin-left:auto;color:var(--cinza)}

/* ---- empilhada (até 1180px): a página rola, a barra fica parada e as abas ganham linha própria ---- */
@media (max-width:1180px){
  html,body{height:auto}
  body{overflow:auto}
  nav.barra{flex-wrap:wrap;gap:6px 14px;padding:8px 16px}
  .nav-links{flex:1 1 100%;order:3}
  .pecas{margin-left:auto}
  .palco{height:auto!important;padding:12px 18px 14px}
  .vista.on{display:block;height:auto}
  .painel,.leitura{height:auto;overflow:visible}
  .v-dupla .leitura{border-left:0;padding-left:0;border-top:1px solid var(--filete-forte);margin-top:22px;padding-top:16px}
  .f-aba,.bt-texto,.volta,.l-elo,.n-ver,.mais,.brand,.pecas,.pecas a{min-height:36px}
  .n-ver{min-width:36px}
  .prem,.f-vem button{min-height:36px}
}
@media (max-width:1180px) and (max-height:500px){nav.barra{position:static}}
/* tablet estreito (até 960px): a capa numa coluna, a lista das premissas em duas */
@media (max-width:960px){
  .capa{grid-template-columns:1fr;gap:26px}
  .premissas{grid-template-columns:repeat(2,minmax(0,1fr))}
}
/* ---- celular (até 767px) ---- */
@media (max-width:767px){
  nav.barra{padding:6px 12px;gap:6px 10px}
  .wm-nome small{display:none}
  .pecas{padding:2px 3px;font-size:12px}
  .pecas .irma-mark{display:none}
  .pecas a{padding:6px}
  .nav-links,.nav-links.duas{display:grid;grid-template-columns:repeat(3,auto);justify-content:stretch;gap:4px}
  .f-aba{display:flex;align-items:center;justify-content:center;font-size:12px;letter-spacing:.06em;padding:0 6px}
  .palco{padding:10px 14px 14px}
  .manchete{font-size:17px}
  .rot,.leitura .rot,.comp-rot,.grupo h4,.sens th,.legenda,.pergunta b{font-size:12px}
  .capa{gap:26px}
  .capa-q{font-size:26px}
  .capa-r{font-size:17.5px}
  .tres{grid-template-columns:1fr;gap:10px}
  .comp,.cen,.pilhas{grid-template-columns:1fr}
  .evita{grid-column:1}
  .trilho{flex-wrap:wrap;row-gap:6px}
  .trilho .v{font-size:24px}
  .equacao{flex-direction:column}
  .eq-op{justify-content:center}
  .pilha{width:100%!important}
  .funil{flex-direction:column}
  .f-seta{justify-content:center;transform:rotate(90deg)}
  .premissas{grid-template-columns:1fr}
  .sens td{white-space:normal}
  .sens th{letter-spacing:.04em}
  .sens th,.sens td{padding:2px 4px}
  .carimbo{margin-left:0}
}
/* nas telas mais estreitas (360px), a barra aperta as margens para a pílula das peças não descer de linha */
/* telas muito estreitas (abaixo de 360px): o número da aba sobe para cima do nome, como na Sistemática, para as três
   colunas caberem sem rolagem lateral */
@media (max-width:359px){
  .nav-links,.nav-links.duas{grid-template-columns:repeat(3,minmax(0,1fr))}
  .f-aba{flex-direction:column;justify-content:center;gap:0;padding:2px 3px;letter-spacing:0;line-height:1.15}
  .f-aba small{margin-right:0}
}
@media (max-width:389px){
  nav.barra{padding:6px 10px}

  .wm-nome{font-size:16px}

}

fazer.", "ja_se_sabe": null, "pergunta": "4", "atualizado": "2026-08-31"}, {"linha": 36, "id": "36", "premissa": "N residentes por modelo 3D (vida útil 5 anos)", "valor": 30, "unidade": "residentes", "fonte": "Decisão de projeto (13/10/2026): 5 anos / 30 residentes. Substituiu 3 anos / 18 (sessão 31/08).", "status": "✅ fonte", "camada": "B", "derivacao": "6 residentes por modelo por ano. O modelo custa R$4.500 e é amortizado no preço: R$150 por residente (30 em 5 anos). Modelos a mais são impressos sob demanda; não são gargalo (Caso_Economico, bloco C). RESSALVA (02/11/2026): o residente fica com o modelo em casa por até 12 semanas (≥16 sessões, 2 por semana), então um modelo atende cerca de 4 residentes por ano (52 ÷ 12 = 4,3), não 6. Se a vida útil for de 5 anos, são cerca de 22 residentes por modelo, e a amortização sobe de R$150 para cerca de R$208; se for de 30 usos, fica em R$150, mas leva cerca de 7 anos. E Caso_Economico!B21 conta só os aprovados, mas todo matriculado usa um modelo: na capacidade, 56 ÷ 4,3 = 13 modelos, não 8. Valor mantido até decidir o prazo do empréstimo e a vida útil.", "ja_se_sabe": null, "pergunta": "—", "atualizado": "2026-11-02"}, {"linha": 37, "id": "37", "premissa": "N residentes por kit laparoscopico (diluicao efetiva)", "valor": 24, "unidade": "residentes", "fonte": "6/coorte x 4 anos - premissa 31/08", "status": "⚠️ hipótese", "camada": "B", "derivacao": "6 por coorte × 4 anos de vida útil do kit (sessão 31/08).", "ja_se_sabe": null, "pergunta": "—", "atualizado": "2026-08-31"}, {"linha": 38, "id": "38", "premissa": "Consumiveis por residente (SEM tacks; inclui reposicao EVA estimada)", "valor": 350, "unidade": "R$/residente", "fonte": "premissa 31/08 - GAP: custo/frequencia EVA", "status": "⚠️ hipótese", "camada": "B", "derivacao": "Sem fonte para a reposição do EVA; no MATTU cada peritônio de USD 100 aguentou ~150 tentativas (Zendejas 2012).", "ja_se_sabe": null, "pergunta": "—", "atualizado": "2026-08-31"}, {"linha": 39, "id": "39", "premissa": "Horas do preceptor por residente APROVADO (devolutiva + presencial e live diluídos pela turma)", "valor": 2.14, "unidade": "h/aprovado", "fonte": "Fórmula sobre as premissas do encontro (linhas 77–80): devolutiva ÷ (1 − (presencial + live) × encontros ÷ horas do preceptor no ano). Com 4 encontros de 8 h, live de 2 h e devolutiva de 1,25 h em 96 h/ano: 2,14 h por aprovado (eram 2,5 h com 6 encontros de 6 h). Limiar: até 5,6 h por aprovado cabem no preço de tabela com margem de 24,6% (Caso_Economico!B46; eram 4,5 h por residente na rodada 2).", "status": "⚠️ declarado", "camada": "A", "derivacao": "RESSALVA: o modelo descartado gastava 4 h de vídeo individual por residente; o novo é em grupo e só para quem chegou à maestria. A devolutiva (1,25 h) é mais da metade: um assistente triando os registros libera mais horas do que juntar encontros. ATENÇÃO: é a premissa que mais move a margem (R$250 por hora). RESSALVA (03/11/2026): as 2,14 h por aprovado supõem encontros cheios, com as 96 h do ano usadas por inteiro (cerca de 11 aprovados por encontro). Numa turma isolada de 6 matriculados (4,8 aprovados), mantidos o encontro de 8 h e a live de 2 h, o preceptor dá 10 h de presencial e live e 6 h de devolutiva (1,25 h × 4,8): 16 h, ou R$666,67 por matriculado em vez de R$428,57. Aí o custo de entrega vai a R$2.187,50, a margem na tabela a 30,25% e o preço de equilíbrio a R$2.916,67, quase os valores de antes da decisão de projeto. É o caso conservador: no formato de turma de 6 das linhas 78 e 79 (encontro de 6 h e live de 1,5 h), seriam 13,5 h e R$562,50 por matriculado, com custo de entrega de R$2.041,67, margem de 31,5% na tabela e equilíbrio de R$2.722,22. A conta só troca o preceptor: a frota (linha 36) fica como está.", "ja_se_sabe": "modelo antigo: 4 h por residente", "pergunta": "2.2", "atualizado": "2026-11-03"}, {"linha": 40, "id": "40", "premissa": "Custo-hora do preceptor", "valor": 250, "unidade": "R$/hora", "fonte": "premissa 31/08 (faixa 150-400)", "status": "⚠️ hipótese", "camada": "B", "derivacao": "Faixa R$150–400 (sessão 31/08). Sensibilidade na aba Analise_Sensibilidade.", "ja_se_sabe": null, "pergunta": "2.2", "atualizado": "2026-08-31"}, {"linha": 41, "id": "41", "premissa": "Hosting de video + certificacao + admin por residente", "valor": 250, "unidade": "R$/residente", "fonte": "A plataforma cotada FORA do escopo - premissa 31/08", "status": "⚠️ hipótese", "camada": "B", "derivacao": "A plataforma cotada (R$123.000) fora do curso; hospedagem interina enxuta.", "ja_se_sabe": null, "pergunta": "—", "atualizado": "2026-08-31"}, {"linha": 42, "id": "42", "premissa": "Contingencia sobre o custo direto de entrega", "valor": 0.4, "unidade": "fracao", "fonte": "premissa 31/08", "status": "⚠️ hipótese", "camada": "B", "derivacao": "Cobre EVA, hospedagem e deslocamento sem fonte.", "ja_se_sabe": null, "pergunta": "—", "atualizado": "2026-08-31"}, {"linha": 43, "id": "43", "premissa": "OPEX", "valor": 0.25, "unidade": "fracao da receita", "fonte": "premissa 31/08 (v1 tinha OPEX = 0)", "status": "⚠️ hipótese", "camada": "B", "derivacao": "Premissa de sessão, não dado do projeto; nenhum custo de vendas/BD foi levantado.", "ja_se_sabe": null, "pergunta": "—", "atualizado": "2026-08-31"}, {"linha": 46, "id": "46", "premissa": "Taxa que chega à maestria (fração dos matriculados que faz a live e o presencial)", "valor": 0.8, "unidade": "fração", "fonte": "Hipótese desta análise: Zendejas 2012 teve 100% em currículo supervisionado; no autoguiado de 12 semanas, assumir 80%. Muda o limiar: o curso se paga, por matrícula, a partir de R$7.500 ÷ (2,24 × 80%) = R$4.185 por complicação; com 60%, seriam R$5.580; com 100%, R$3.348. E muda o custo por matriculado (rateio da supervisão).", "status": "⚠️ declarado", "camada": "B", "derivacao": "Só quem chega à maestria usa o preceptor (live, presencial e devolutiva): por matriculado, o preceptor custa h por aprovado × custo-hora × esta taxa (Custo_Entrega!B5). Até 02/11/2026 a fórmula dividia pela taxa: R$669,64 por matriculado em vez de R$428,57. Os R$428,57 valem com encontros cheios; numa turma isolada de 6, cerca de R$667 (ver linha 39). ALTERNATIVA: com 60%, R$321,43 por matriculado; com 100%, R$535,71 (por aprovado, o custo fica em R$535,71). RESSALVA: como o residente corrige erro sem supervisor nas ≥16 sessões é o risco pedagógico.", "ja_se_sabe": "Zendejas 2012: 100%, mas supervisionado", "pergunta": "2.1", "atualizado": "2026-11-03"}, {"linha": 47, "id": "47", "premissa": "Custo de uma complicação intraoperatória - CASO-BASE (= limiar: o valor em que o curso se paga)", "valor": 4185.27, "unidade": "R$/complicação", "fonte": "Decisão de 21/10/2026: o caso-base é o próprio ponto de virada (preço de tabela ÷ complicações evitadas por matrícula, 2,24 × 80% que chegam à maestria = R$4.185,27; até 03/11/2026, sem os 80%, eram R$3.348,21). Leitura: 'se uma complicação custar isto ou mais para quem paga a cirurgia, o curso se paga'. Substituir pela fórmula o dado do Dr. Paulo (linha 57) quando chegar.", "status": "⚠️ declarado", "camada": "A", "derivacao": "RESSALVA: é circular por construção (custo líquido = 0 no caso-base); por isso o piso (linha 25) e o teto (linha 26) entram sempre ao lado. ATENÇÃO: se o preço mudar, o caso-base muda junto. CORREÇÃO (03/11/2026): o limiar conta os 80% que chegam à maestria. Os 20% que não chegam também pagam e não evitam complicação; por isso o limiar é o preço ÷ (2,24 × 80%) = R$4.185,27 por matrícula, e não R$3.348,21, que supunha todos na maestria. Na capacidade, a economia do caso-base (R$420.000 por ano) passa a empatar com a receita, como deve.", "ja_se_sabe": "faixa R$1.936–10.000 sem fonte primária", "pergunta": "5.1", "atualizado": "2026-11-03"}, {"linha": 48, "id": "48", "premissa": "Horas/mês do Dr. Paulo para o curso", "valor": 8, "unidade": "h/mês", "fonte": "Hipótese desta análise: 2 h por semana (uma tarde a cada duas semanas). Capacidade = 8 h × 12 ÷ 2,14 h por aprovado ≈ 45 aprovados/ano. É o único teto do curso: os modelos imprimem-se sob demanda (R$4.500, 6 aprovados por modelo por ano) e são amortizados no preço (R$150 por matriculado).", "status": "⚠️ declarado", "camada": "A", "derivacao": "ATENÇÃO: 45 aprovados/ano pedem 8 modelos (5 a imprimir, R$22.500); os 56 matriculados/ano recolhem R$42.000 de amortização em 5 anos, mais que os R$36.000 dos 8 modelos. RESSALVA (02/11/2026): essa conta supõe 6 residentes por modelo por ano e conta só os aprovados; com o modelo em casa por até 12 semanas cabem cerca de 4 por ano, e todo matriculado usa um modelo: seriam cerca de 13 (ver linha 36). O modelo vai em comodato, dentro da taxa. RESSALVA: nada no vault confirma a disponibilidade; pergunta 2.5 do roteiro.", "ja_se_sabe": "é o teto do curso; nada no vault responde", "pergunta": "2.5", "atualizado": "2026-11-03"}, {"linha": 49, "id": "49", "premissa": "Preço do curso - piloto", "valor": 5475, "unidade": "R$/residente", "fonte": "Hipótese desta análise: o piloto cobra o preço de volume (R$5.475). Se for interno, zero: a conta vira custo do estudo. Limiar: R$2.916,67 numa turma isolada de 6, com o preceptor (rodada 3, ressalva da linha 39); era R$1.672,22 sem o preceptor (rodada 2).", "status": "⚠️ declarado", "camada": "B", "derivacao": "ALTERNATIVA: piloto gratuito para os 18 do estudo 2.0 = R$33.375 de custo de entrega sem receita, com encontros cheios (18 × R$1.854,17); em três turmas isoladas de 6, cerca de R$39.375 (18 × R$2.187,50, o caso conservador da linha 39); no formato de turma de 6 das linhas 78 e 79, R$36.750 (18 × R$2.041,67).", "ja_se_sabe": "pode ser interno ou zero", "pergunta": "1.3", "atualizado": "2026-11-03"}, {"linha": 50, "id": "50", "premissa": "Residentes por coorte no piloto", "valor": 6, "unidade": "residentes", "fonte": "Hipótese desta análise: 6 por coorte, como no estudo 2.0 (3 coortes × 6 = 18). Limiar: 3,1 residentes amortizam os modelos (rodada 2).", "status": "⚠️ declarado", "camada": "B", "derivacao": "RESSALVA: vale para o piloto; na operação a turma do encontro é a linha 81 (aprovados ÷ encontros).", "ja_se_sabe": "6/coorte (31/08) · 18 no estudo", "pergunta": "1.2", "atualizado": "2026-10-21"}, {"linha": 51, "id": "51", "premissa": "Deslocamento e espaço do encontro presencial - custo para o curso, por turma", "valor": 0, "unidade": "R$/turma", "fonte": "Zero declarado: o Einstein cederia sala e torre, a confirmar; o deslocamento é do residente. Com 0, o custo do presencial deixa de ficar ⚪.", "status": "⚠️ declarado", "camada": "B", "derivacao": "RESSALVA: a contingência de 40% absorve até R$358,33 por residente (rodada 2) se o espaço vier a ser cobrado.", "ja_se_sabe": "nunca entrou em planilha", "pergunta": "2.3", "atualizado": "2026-11-03"}, {"linha": 52, "id": "52", "premissa": "Aluguel do kit - nível 1, por residente (receita do curso)", "valor": 145.83, "unidade": "R$/residente", "fonte": "Hipótese desta análise: repasse do custo diluído do kit (R$3.500 ÷ 24 = R$145,83), sem margem. Preço comercial a definir.", "status": "⚠️ declarado", "camada": "B", "derivacao": "RESSALVA: abaixo disto o aluguel subsidia o residente; acima, vira receita. O residente dos níveis 2 e 3 compra o próprio kit.", "ja_se_sabe": "a aba Kit da plataforma tem CTA sem preço", "pergunta": "3.1", "atualizado": "2026-10-21"}, {"linha": 53, "id": "53", "premissa": "Envio e devolução do kit, por residente", "valor": 120, "unidade": "R$/residente", "fonte": "Hipótese desta análise: caixa de 5 kg, ida e volta por transportadora, SP → capitais. Faixa R$80–150.", "status": "⚠️ declarado", "camada": "B", "derivacao": "RESSALVA: sem cotação; entra no custo do curso só se o aluguel não cobrir.", "ja_se_sabe": "sem cotação no vault", "pergunta": "3.2", "atualizado": "2026-10-21"}, {"linha": 54, "id": "54", "premissa": "Produção dos pré-módulos (custo fixo)", "valor": 0, "unidade": "R$", "fonte": "Zero declarado: os 3 módulos de nivelamento são produzidos pela equipe e ainda não estão prontos. O <script>
(function () {

  function num(x, dec) { return Number(x).toLocaleString("pt-BR", { minimumFractionDigits: dec || 0, maximumFractionDigits: dec || 0 }); }

  };

  // a linha 81 é uma conta (aprovados ÷ encontros), não premissa: aparece como resultado e fica fora da contagem

    if (RESULTADOS.indexOf(+l) >= 0) return "res";

  }
  var NOME_ST = { fonte: "fonte", hip: "hipótese", dec: "declarado", falta: "falta", res: "resultado" };

  var hTodos = P.residentes_r1 * M * K.horas_por_aprovado / 12, agendasTodos = Math.ceil(hTodos / K.horas_mes);
  var H = J.horas_mes, ano2 = 0; while (ano2 < H.length && H[ano2] <= K.horas_mes) ano2++;
  var agendasFim = Math.ceil(H[H.length - 1] / K.horas_mes);
  var LISTA = C.premissas.filter(function (p) { return RESULTADOS.indexOf(p.linha) < 0; });
  var ST = { fonte: 0, hip: 0, dec: 0, falta: 0 }, EM_FALTA = [];
  LISTA.forEach(function (p) { var s = status(p.linha); ST[s]++; if (s === "falta") EM_FALTA.push(p.linha); });
  // a leitura de cada cenário sai da conta, e não de um rótulo escrito à mão
  function leituraCen(s) { var r = s.economia / preco; return Math.abs(r - 1) < 1e-6 ? "a economia iguala o preço" : r < 1 ? "a economia cobre " + pct(r) + " do preço" : "a economia é " + num(r, 1) + " vezes o preço"; }
  var SUB_CEN = { piso: "duas internações pagas pelo SUS", base: "o limiar: o curso empata", teto: "uma complicação grave" };

  /* ---------- pedaços de HTML ---------- */
  function ver(id, html, cls) { return "<button type='button' class='n-ver" + (cls ? " " + cls : "") + "' data-conta='" + id + "'>" + html + "</button>"; }
  function linhaPrem(l) {
    return "<button type='button' data-prem='" + l + "' title='" + esc(rotulo(l)) + ": " + valor(l) + "'><span class='pt " + status(l) + "' aria-hidden='true'></span>" +
      esc(rotulo(l)) + "<span class='so-leitor'> (" + NOME_ST[status(l)] + ")</span></button>";
  }
  function elo(vista, texto, volta) { return "<button type='button' class='l-elo' data-vai='" + vista + "'>" + (volta ? "← " : "→ ") + esc(texto) + "</button>"; }
  function bloco(rot, corpo) { return "<div class='bloco'><p class='rot'>" + rot + "</p>" + corpo + "</div>"; }
  function sensTabela(cab, linhas, hojeIdx) {
    return "<table class='sens'><tr>" + cab.map(function (c) { return "<th>" + c + "</th>"; }).join("") + "</tr>" +
      linhas.map(function (l, i) { return "<tr" + (i === hojeIdx ? " class='hoje'" : "") + ">" + l.map(function (c) { return "<td" + (c.cls ? " class='" + c.cls + "'" : "") + ">" + (c.t !== undefined ? c.t : c) + "</td>"; }).join("") + "</tr>"; }).join("") + "</table>";
  }
  // a ficha de um número: o valor, a conta com os valores de hoje, o que muda se uma premissa mudar, a ressalva e as premissas
  function ficha(o) {
    return "<button type='button' class='volta' data-volta>← a leitura da aba</button><div class='ficha'><h3 tabindex='-1'>" + esc(o.titulo) + "</h3>" +
      (o.valor ? "<p class='f-valor'>" + o.valor + "</p>" : "") +

  }

  /* ---------- as fichas: cada número sublinhado abre a sua conta ---------- */
  var FICHAS = {
    "c-hoje": function () { return ficha({ titulo: "Complicações esperadas hoje", valor: num(R.complicacoes_hoje, 2) + " por residente",

    "c-com": function () { return ficha({ titulo: "Complicações esperadas com o curso", valor: num(R.complicacoes_com, 2) + " em quem chega à maestria",

    var maxE = Math.max.apply(null, S.map(function (s) { return s.economia; })), esq = preco / (preco + maxE);
    var linhas = S.map(function (s) {
      var liq = s.liquido, cls = liq > 0 ? "neg" : liq < 0 ? "pos" : "zero", larg = s.economia / maxE, rot = "+" + brl(s.economia);
      // o rótulo vai dentro da barra verde quando ela tem largura para ele; senão, logo depois dela
      var dentro = larg >= 0.4;
      return "<div class='cen-nome'><b>" + esc(s.rotulo.split(":")[0]) + " · " + brl(s.custo_complicacao) + "</b><span>" + esc(SUB_CEN[s.nome] || (s.rotulo.split(":")[1] || "").trim()) + "</span></div>" +
        "<div class='div' style='grid-template-columns:" + (esq * 100).toFixed(2) + "% 1fr;--zero:" + (esq * 100).toFixed(2) + "%'>" +
        "<div class='esq'><div class='bar paga' style='width:100%'>−" + brl(preco) + "</div></div>" +
        "<div class='dir'><div class='bar ganha' style='width:" + (larg * 100).toFixed(1) + "%'>" + (dentro ? rot : "") + "</div>" + (dentro ? "" : "<span class='bar-v'>" + rot + "</span>") + "</div></div>" +
        "<div class='saldo " + cls + "'>" + ver("c-cenarios", "<b>" + (liq > 0 ? "faltam " + brl(liq) : liq < 0 ? "sobram " + brl(-liq) : "R$0") + "</b>") + "<span>" + leituraCen(s) + "</span></div>";
    }).join("");
    return "<div class='sec'><p class='rot'>Por matrícula, em três custos de uma complicação</p><div class='cen'>" + linhas + "</div>" +
      "<p class='leg'><span><i class='paga'></i>quem compra o curso: o programa, o hospital ou o residente</span><span><i class='ganha'></i>quem paga a cirurgia: o SUS ou a operadora</span></p></div>" +
      "<div class='sec'><p class='rot'>Quanto o SUS e a operadora pagam pela via por vídeo, por caso</p><ul class='reemb'>" +
      "<li><b>SUS</b>: " + brl(P.sus_video) + " pelo vídeo, contra " + brl(P.sus_aberta) + " pela via aberta, <span class='abaixo'>" + pct(-P.sus_delta / P.sus_aberta) + " abaixo</span></li>" +
      "<li><b>Operadora</b>: " + brl(P.suplementar_video) + " contra " + brl(P.suplementar_aberta) + ", <span class='acima'>" + pct(P.suplementar_delta / P.suplementar_aberta) + " acima</span></li>" +
      "</ul><p class='nota'>" + ver("c-reemb", "No SUS-SP, em 2024, só " + pct(P.fracao_video, 1) + " das " + num(P.internacoes_sp) + " internações por hérnia inguinal foram por vídeo.") + "</p></div>";
  }
  function leituraPagador() {
    return bloco("O que esta tela diz", "<p class='achado'>O retorno vai a outro ator.</p>" +
        "<p>Para quem compra, o argumento é formação e segurança. O retorno financeiro só existe se quem paga a cirurgia entrar no financiamento.</p>") +
      bloco("O que falta", "<p>O custo real de uma complicação: acima de " + brl(R.rcei) + ", o curso se paga para quem paga a cirurgia.</p>" +
        "<p>No SUS, a via por vídeo já é paga abaixo da aberta: lá, o único argumento é menos complicação. Na operadora, ela é paga a mais, mas a operadora não financia formação.</p>") +
      elo("empresa", "a empresa que entrega o curso se sustenta?");
  }

  /* ---------- 03 · a empresa ---------- */
  function cenaEmpresa() {
    // os pedaços do preço, na ordem da barra; o OPEX e os impostos não têm ficha própria: entram na conta da margem
    // (objetos, e não listas aninhadas: a trava do publicador recusa colchete duplo)
    var SEG = [{ k: "direto", rot: "custo direto", conta: "c-direto" }, { k: "prec", rot: "preceptor", conta: "c-preceptor" }, { k: "opex", rot: "OPEX " + pct(OPEX) },
      { k: "imp", rot: "impostos " + pct(IMP) }, { k: "lucro", rot: "lucro", conta: "c-margem" }];
    function pilha(nome, sub, p, vals, marg) {
      return "<div class='pilha-nome'><b>" + nome + "</b><span>" + sub + "</span></div><div class='pilha' style='width:" + (p / E.preco_tabela * 100).toFixed(1) + "%'>" +
        SEG.map(function (s, i) {
          var dica = esc(s.rot + ": " + brl(vals[i], 2)), estilo = " style='flex:" + vals[i].toFixed(2) + " 1 0' title='" + dica + "'";
          return s.conta ? "<button type='button' class='seg " + s.k + "' data-conta='" + s.conta + "' aria-label='" + dica + "'" + estilo + ">" + brl(vals[i]) + "</button>"
            : "<span class='seg " + s.k + "'" + estilo + ">" + brl(vals[i]) + "</span>";
        }).join("") +
        "</div><div class='marg'>" + ver("c-margem", "<b>" + pct(marg, 1) + "</b>") + "<span>de margem</span></div>";
    }
    var pts = SENS.horas.map(function (s) { return { h: s.horas, m: s.margem }; });
    pts.push({ h: K.horas_por_aprovado, m: E.margem_tabela, hoje: true }); pts.sort(function (a, b) { return a.h - b.h; });
    var mmax = Math.max.apply(null, pts.map(function (p) { return p.m; }));
    return "<div class='sec'><p class='rot'>Para onde vai o preço, por matrícula</p><div class='pilhas'>" +
      pilha("Tabela", brl(E.preco_tabela), E.preco_tabela, [E.custo_direto_sem_supervisao, precCont, opexT, impT, E.lucro_tabela], E.margem_tabela) +
      pilha("Volume", brl(E.preco_volume) + ", de 20 para cima", E.preco_volume, [E.custo_direto_sem_supervisao, precCont, opexV, impV, E.lucro_volume], E.margem_volume) +
      "</div><p class='leg'><span><i class='direto'></i>custo direto</span><span><i class='prec'></i>preceptor</span><span><i class='opex'></i>OPEX</span><span><i class='imp'></i>impostos</span><span><i class='lucro'></i>lucro</span></p>" +
      "<p class='linha-eq'>Entregar custa " + ver("c-entrega", "<b>" + brl(E.custo_entrega) + "</b>") + " por matrícula, com encontros cheios. Preço mínimo, com margem zero: " + ver("c-equilibrio", "<b>" + brl(equil) + "</b>") + ".</p></div>" +
      "<div class='sec'><p class='rot'>O que mais move a margem: as horas do preceptor por aprovado</p>" +
      "<div class='colunas'>" + pts.map(function (p) { return "<div class='col" + (p.hoje ? " hoje" : "") + "'><span class='cv'>" + pct(p.m, 1) + "</span><span class='cb' style='height:" + (p.m / mmax * 82).toFixed(1) + "%'></span></div>"; }).join("") + "</div>" +
      "<div class='col-rot'>" + pts.map(function (p) { return "<span" + (p.hoje ? " class='hoje'" : "") + ">" + numc(p.h) + " h" + (p.hoje ? " · hoje" : "") + "</span>"; }).join("") + "</div></div>";
  }
  function leituraEmpresa() {
    var ultimo = SENS.horas[SENS.horas.length - 1];
    return bloco("O que esta tela diz", "<p class='achado'>O preço paga a entrega com folga: entregar custa " + pct(E.custo_entrega / E.preco_tabela) + " da tabela.</p>" +
        "<p>Com " + numc(ultimo.horas) + " h de preceptor por aprovado, " + num(ultimo.horas / K.horas_por_aprovado, 1) + " vezes a de hoje, a margem ainda fica em " + pct(ultimo.margem, 1) + ".</p>") +
      bloco("Ressalvas", "<p>A conta supõe encontros cheios, com cerca de " + num(K.residentes_por_encontro) + " aprovados cada. Numa turma isolada de " + T.turma + ", o preceptor passa de " + brl(precCont) + " para " + brl(T.preceptor * (1 + CONT)) + " por matrícula, e a margem cai para " + pct(T.margem, 1) + " na tabela, ou " + pct(margIsoPiloto, 1) + " no preço do piloto.</p>" +
        "<p>O custo ainda inclui o kit (" + brl(kit, 2) + "), que o residente paga pela regra nova; sem ele, a margem na tabela sobe para " + pct(margSemKit, 1) + ".</p>") +
      "<p class='dica'>" + TOQUE + " num número sublinhado, ou num pedaço da barra, para ver a conta.</p>" + elo("escala", "quantos o curso forma por ano, e o que limita?");
  }

  /* ---------- 04 · a escala ---------- */
  function cenaEscala() {
    var hmax = Math.max.apply(null, H.concat([K.horas_mes])), alt = function (h) { return (h / hmax * 82).toFixed(1); };
    return "<div class='sec'><p class='rot'>Do país à turma, por ano, na agenda de hoje</p><div class='funil'>" +
      "<button type='button' class='f-passo' data-prem='6'><b>" + num(P.residentes_r1) + "</b><span>novos residentes por ano, no Brasil</span></button><span class='f-seta' aria-hidden='true'>→</span>" +
      "<button type='button' class='f-passo cap' data-conta='c-capacidade'><b>" + mat + "</b><span>matrículas: o teto de " + K.horas_mes + " h por mês do preceptor</span></button><span class='f-seta' aria-hidden='true'>→</span>" +
      "<button type='button' class='f-passo cap' data-conta='c-capacidade'><b>" + cap + "</b><span>aprovados: " + pct(M) + " chegam à maestria</span></button><span class='f-seta' aria-hidden='true'>→</span>" +
      "<button type='button' class='f-passo ok' data-conta='c-evitadas-ano'><b>" + num(K.evitadas_ano) + "</b><span>complicações evitadas</span></button>" +
      "</div><p class='chips'><span>Quem paga a cirurgia poupa " + ver("c-economia-ano", "<b>" + mil(K.economia_ano_piso) + " a " + mil(K.economia_ano_teto) + "</b>") + "</span>" +
      "<span>Receita " + ver("c-receita", "<b>" + mil(K.receita_ano) + "</b>") + "</span><span>Lucro " + ver("c-receita", "<b>" + mil(K.lucro_ano) + "</b>") + "</span>" +
      "<span>" + ver("c-modelos", "<b>" + K.modelos_necessarios + " modelos</b>") + ", " + K.modelos_a_imprimir + " a imprimir</span></p></div>" +
      "<div class='sec'><p class='rot'>Se a adoção crescer como na projeção: horas de preceptor por mês</p><div class='proj'>" +
      "<div class='colunas'>" + H.map(function (h) { return "<div class='col" + (h > K.horas_mes ? " passa" : "") + "'><span class='cv'>" + num(h, 1) + " h</span><span class='cb' style='height:" + alt(h) + "%'></span></div>"; }).join("") +
      "<div class='agenda' style='bottom:" + alt(K.horas_mes) + "%'></div></div>" +
      "<div class='col-rot'>" + H.map(function (h, i) { return "<span>ano " + (i + 1) + " · " + pct(J.adocao[i]) + "</span>"; }).join("") + "</div></div>" +
      "<p class='leg'><span><i class='agenda-leg'></i>a agenda de hoje: " + K.horas_mes + " h por mês</span><span><i class='passa'></i>passa da agenda</span></p>" +
      "<p class='nota'>" + ver("c-projecao", "Um segundo preceptor já no ano " + (ano2 + 1) + "; cerca de " + agendasFim + " preceptores no ano " + H.length + ".") + "</p></div>";
  }
  function leituraEscala() {
    return bloco("O que esta tela diz", "<p class='achado'>O teto é a agenda do preceptor, não o modelo.</p>" +
        "<p>Crescer pede mais preceptores antes de pedir mais modelos: modelos se imprimem; preceptores, não.</p>") +
      bloco("A escala do problema", "<p>Se todos os " + num(P.residentes_r1) + " novos residentes do ano treinassem, " + pct(M) + " chegariam à maestria: " + num(P.todos_evitadas_ano) + " complicações evitadas por ano, com cerca de " + num(hTodos) + " h por mês de preceptor, ou " + agendasTodos + " agendas como a de hoje.</p>") +
      bloco("Ressalva", "<p>Os " + K.modelos_necessarios + " modelos supõem " + num(K.residentes_por_modelo_ano) + " aprovados por modelo por ano. Com 12 semanas em casa e um modelo por matrícula, seriam " + frota + ", e a amortização de 5 anos não pagaria a frota.</p>") +
      elo("premissas", "o que está assumido, e o que falta?");
  }

  /* ---------- 05 · as premissas ---------- */
  // quatro colunas de grupos; cada grupo, as linhas do livro na ordem da conta
  var GRUPOS = [
    [{ t: "O efeito clínico", l: [10, 11, 7] }, { t: "O custo de uma complicação", l: [25, 47, 26, 57] }],
    [{ t: "A entrega", l: [18, 36, 66, 35, 37, 52, 53, 38, 41, 42, 43, 56, 51, 54, 55] }],
    [{ t: "O preço", l: [33, 34, 49, 50] }, { t: "O preceptor", l: [48, 40, 39, 80, 77, 78, 79, 46, 81] }],
    [{ t: "Quem paga a cirurgia, e a escala", l: [60, 61, 62, 63, 64, 65, 6, 70, 71, 72, 73, 74] }]
  ];
  function cenaPremissas() {
    return "<div class='premissas'>" + GRUPOS.map(function (col) {
      return "<div>" + col.map(function (g) {
        return "<div class='grupo'><h4>" + g.t + "</h4>" + g.l.map(function (l) {
          return "<button type='button' class='prem' data-prem='" + l + "'><span class='pt " + status(l) + "' aria-hidden='true'></span><span>" + esc(rotulo(l)) +
            "<span class='so-leitor'> (" + NOME_ST[status(l)] + ")</span></span><span class='pv'>" + valor(l) + "</span></button>";
        }).join("") + "</div>";
      }).join("") + "</div>";
    }).join("") + "</div>";
  }
  function leituraPremissas() {
    return bloco("As que mais movem a conta", "<p>O custo de uma complicação decide se o curso se paga (aba 02).</p><p>A hora do preceptor decide a margem e o teto de aprovados (abas 03 e 04).</p>" +
        "<p>A linha cinza é um resultado da conta, e não uma premissa.</p>") +
      "<p class='dica'>" + TOQUE + " numa premissa para ver de onde vem o valor.</p>" + elo("leitura", "ao começo: a leitura", true);
  }
  function mancheteP() {
    var s = LISTA.length + " premissas: " + ST.fonte + " com fonte, " + ST.hip + " hipóteses, " + ST.dec + " declaradas e " + ST.falta + " em falta";
    if (EM_FALTA.length === 1) { var r = rotulo(EM_FALTA[0]); s += ": " + r.charAt(0).toLowerCase() + r.slice(1); }
    return s + ".";
  }

  /* ---------- as seis abas ---------- */
  var VISTAS = [
    { id: "leitura", n: "00", cam: "Leitura", perg: "O que a conta diz, numa tela?", manchete: "", cena: cenaLeitura },
    { id: "residente", n: "01", cam: "Residente", perg: "O que o curso muda para cada residente treinado?",
      manchete: "Nos " + R.casos_janela + " primeiros casos, as complicações esperadas caem de " + num(R.complicacoes_hoje, 2) + " para " + num(R.complicacoes_com, 2) + " em quem chega à maestria; por matrícula, cada uma evitada custa " + brl(R.rcei) + ".", cena: cenaResidente, leitura: leituraResidente },
    { id: "pagador", n: "02", cam: "Quem paga", perg: "Quem paga o curso, e quem fica com a economia?",
      manchete: "Quem compra o curso paga " + brl(preco) + " por matrícula e não recebe de volta; a economia fica com quem paga a cirurgia.", cena: cenaPagador, leitura: leituraPagador },
    { id: "empresa", n: "03", cam: "Empresa", perg: "A empresa que entrega o curso se sustenta?",
      manchete: "Sim: a margem fica em " + pct(E.margem_tabela, 1) + " na tabela e " + pct(E.margem_volume, 1) + " no volume, com encontros cheios.", cena: cenaEmpresa, leitura: leituraEmpresa },
    { id: "escala", n: "04", cam: "Escala", perg: "Quantos o curso forma por ano, e o que limita?",
      manchete: "Com " + K.horas_mes + " h por mês do preceptor, o curso forma até " + cap + " por ano e evita " + num(K.evitadas_ano) + " complicações.", cena: cenaEscala, leitura: leituraEscala },
    { id: "premissas", n: "05", cam: "Premissas", perg: "O que está assumido, e o que ainda falta?", manchete: mancheteP(), cena: cenaPremissas, leitura: leituraPremissas }
  ];
  var IDS = VISTAS.map(function (v) { return v.id; });

  /* ---------- encaixe: cada painel cabe na altura e na largura da tela (desktop), como na Sistemática ----------
     O zoom encolhe o painel até caber: desce até o data-piso e, se ainda não couber, até 0,5; só abaixo disso o
     painel rola (classe "rola", a rede de segurança). Com folga, cresce até o data-cresce. */
  var EMPILHA = 1180, PISO_MINIMO = 0.5, ajustaveis = [];
  function encaixa(cont) {
    var w = cont && cont.firstElementChild;
    if (!w) return;
    cont.classList.remove("rola");
    if (window.innerWidth <= EMPILHA) { w.style.zoom = "1"; return; }
    if (!cont.clientHeight) return;
    w.style.zoom = "1";
    var alvo = cont.clientHeight - 6, teto = parseFloat(cont.getAttribute("data-cresce")) || 1;
    // uma tabela larga numa ficha pede zoom como uma ficha alta: nada pode ficar cortado à direita
    function cabe() { return w.getBoundingClientRect().height <= alvo && cont.scrollWidth <= cont.clientWidth + 1; }
    if (cabe()) {
      if (teto > 1) {
        var bom = 1;
        for (var g = 1.04; g <= teto + 1e-9; g += 0.04) { w.style.zoom = String(g); if (!cabe()) break; bom = g; }
        w.style.zoom = String(bom);
      }
      return;
    }
    var piso = +(cont.getAttribute("data-piso") || 0.6);
    for (var z = 1; z > PISO_MINIMO && !cabe();) { z = Math.max(z > piso ? piso : PISO_MINIMO, z - 0.03); w.style.zoom = String(z); }
    if (!cabe()) cont.classList.add("rola");
  }
  // o rótulo de um pedaço da barra que não cabe nele some (o valor segue no title, no aria-label e na ficha)
  function marcaFora(raiz) {
    Array.prototype.forEach.call((raiz || document).querySelectorAll(".seg"), function (s) { s.classList.remove("fora"); if (s.scrollWidth > s.clientWidth + 1) s.classList.add("fora"); });
  }
  function escreve(cont, html) {
    cont.innerHTML = "<div class='ajusta'>" + html + "</div>";
    if (ajustaveis.indexOf(cont) < 0) ajustaveis.push(cont);
    encaixa(cont);
  }
  function barraParada() { var b = document.querySelector("nav.barra"); return getComputedStyle(b).position === "sticky" ? b.offsetHeight : 0; }
  function dimensiona() {
    var palco = document.querySelector(".palco"), empilhada = window.innerWidth <= EMPILHA;
    // empilhada, a barra parada não pode cobrir o elemento que recebe o foco
    document.documentElement.style.scrollPaddingTop = empilhada ? (barraParada() + 8) + "px" : "";
    if (empilhada) { palco.style.height = ""; return; }
    palco.style.height = Math.max(420, document.documentElement.clientHeight - document.querySelector("nav.barra").offsetHeight) + "px";
  }
  function ajustaAbas() {
    nav.classList.remove("duas");
    var b = nav.children;
    if (b.length && b[b.length - 1].getBoundingClientRect().top - b[0].getBoundingClientRect().top > 4) nav.classList.add("duas");
  }
  function reencaixa() { ajustaAbas(); dimensiona(); ajustaveis.forEach(encaixa); marcaFora(); }
  var tempo;
  window.addEventListener("resize", function () { clearTimeout(tempo); tempo = setTimeout(reencaixa, 150); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(reencaixa);
  window.addEventListener("load", reencaixa);

  /* ---------- as abas ---------- */
  var nav = document.getElementById("abas"), botoes = {}, atual = null, selecao = {};
  VISTAS.forEach(function (v) {
    var b = document.createElement("button");
    b.type = "button"; b.className = "f-aba"; b.id = "aba-" + v.id; b.setAttribute("role", "tab"); b.setAttribute("aria-controls", "v-" + v.id);
    b.innerHTML = "<small>" + v.n + "</small>" + esc(v.cam.toUpperCase());
    b.setAttribute("aria-label", v.n + " · " + v.cam);
    b.addEventListener("click", function () { abre(v.id); });
    nav.appendChild(b); botoes[v.id] = b;
  });
  nav.addEventListener("keydown", function (ev) {
    var i = IDS.indexOf(atual), j = ev.key === "ArrowRight" ? (i + 1) % IDS.length : ev.key === "ArrowLeft" ? (i - 1 + IDS.length) % IDS.length : ev.key === "Home" ? 0 : ev.key === "End" ? IDS.length - 1 : -1;
    if (j < 0) return;
    ev.preventDefault(); abre(IDS[j]); botoes[IDS[j]].focus();
  });
  // a cena de cada aba é escrita uma vez; a leitura troca entre a da aba e a ficha do número escolhido
  VISTAS.forEach(function (v) { escreve(document.getElementById("p-" + v.id), v.cena()); });
  function anuncia(s) { document.getElementById("anuncio").textContent = s; }
  function existe(item) { return item.indexOf("p:") === 0 ? !!PREM[item.slice(2)] : !!FICHAS[item]; }
  function mostraLeitura(id) {
    var v = VISTAS[IDS.indexOf(id)], cont = document.getElementById("l-" + id);
    if (!cont) return;
    var item = selecao[id];
    // um item que não existe (endereço cortado ou de outra versão) volta à leitura da aba e sai do endereço
    if (item && !existe(item)) item = selecao[id] = null;
    escreve(cont, !item ? v.leitura() : item.indexOf("p:") === 0 ? fichaPrem(+item.slice(2)) : FICHAS[item]());
    var cena = document.getElementById("p-" + id);
    Array.prototype.forEach.call(cena.querySelectorAll("[data-conta],[data-prem]"), function (el) {
      var chave = el.getAttribute("data-conta") || "p:" + el.getAttribute("data-prem");
      el.classList.toggle("on", chave === item);
      el.setAttribute("aria-pressed", chave === item ? "true" : "false");
    });
    var t = cont.querySelector(".ficha h3"); if (t) anuncia(t.textContent);
  }
  // empilhada, a ficha fica embaixo da cena: rola até ela
  function rolaAteFicha() {
    if (window.innerWidth > EMPILHA) return;
    var l = document.getElementById("l-" + atual); if (!l) return;
    window.scrollTo({ top: Math.max(0, l.getBoundingClientRect().top + window.pageYOffset - barraParada() - 8), behavior: SUAVE ? "smooth" : "auto" });
  }
  function focaFicha() { var t = document.querySelector("#l-" + atual + " .ficha h3"); if (t) t.focus({ preventScroll: true }); }
  function abre(id, item) {
    if (IDS.indexOf(id) < 0) id = "leitura";
    var v = VISTAS[IDS.indexOf(id)];
    atual = id;
    VISTAS.forEach(function (x) {
      var on = x.id === id;
      document.getElementById("v-" + x.id).classList.toggle("on", on);
      botoes[x.id].classList.toggle("on", on); botoes[x.id].setAttribute("aria-selected", on ? "true" : "false"); botoes[x.id].tabIndex = on ? 0 : -1;
    });
    document.getElementById("pergunta").innerHTML = "<b>" + v.n + " · " + esc(v.cam) + "</b> · " + esc(v.perg);
    document.getElementById("manchete").textContent = v.manchete;
    if (item !== undefined && v.leitura) selecao[id] = item;
    if (v.leitura) mostraLeitura(id);
    estadoNaUrl(); reencaixa();
    if (window.innerWidth <= EMPILHA && window.pageYOffset) window.scrollTo(0, 0);
    if (item !== undefined && selecao[id]) rolaAteFicha();
  }
  function escolhe(item) {
    selecao[atual] = selecao[atual] === item ? null : item;
    mostraLeitura(atual); estadoNaUrl(); marcaFora();
    if (selecao[atual]) rolaAteFicha();
  }
  // fechar a ficha devolve o foco ao número que a abriu, quando o foco estava dentro dela
  function fechaFicha() {
    var cena = document.getElementById("p-" + atual), dono = cena && cena.querySelector(".on[data-conta],.on[data-prem]");
    var l = document.getElementById("l-" + atual), dentro = l && l.contains(document.activeElement);
    selecao[atual] = null; mostraLeitura(atual); estadoNaUrl();
    if (dentro) { if (dono) dono.focus(); else { var b = l.querySelector("button"); if (b) b.focus(); } }
  }
  function estadoNaUrl() {
    try { history.replaceState(null, "", "?vista=" + atual + (selecao[atual] ? "&item=" + encodeURIComponent(selecao[atual]) : "")); } catch (e) { /* file:// em alguns navegadores */ }
  }
  // um clique só, para a página toda: abas internas, números, premissas, "ler tudo" e a volta à leitura
  document.addEventListener("click", function (ev) {
    var el = ev.target.closest("[data-vai],[data-conta],[data-prem],[data-volta],[data-mais]");
    if (!el) return;
    if (el.hasAttribute("data-mais")) { inteira = true; mostraLeitura(atual); focaFicha(); return; }
    inteira = false;
    if (el.hasAttribute("data-vai")) {
      ev.preventDefault();
      var item = el.getAttribute("data-item") || undefined;
      abre(el.getAttribute("data-vai"), item);
      if (item) focaFicha();
      return;
    }
    if (el.hasAttribute("data-volta")) { fechaFicha(); return; }
    if (el.hasAttribute("data-conta")) { escolhe(el.getAttribute("data-conta")); return; }
    var l = el.getAttribute("data-prem");
    if (atual === "premissas" && document.getElementById("p-premissas").contains(el)) escolhe("p:" + l);
    else { abre("premissas", "p:" + l); focaFicha(); }
  });
  document.addEventListener("keydown", function (ev) { if (ev.key === "Escape" && atual && selecao[atual]) fechaFicha(); });

  // o carimbo: a meta "publicacao" (N|AAAA-MM-DD) só existe preenchida na página publicada
  var pub = (document.querySelector('meta[name="publicacao"]') || { content: "" }).content.split("|");
  document.getElementById("carimbo").textContent = (pub[1] ? "Estado em " + data(pub[1]) + " · publicação " + pub[0] + " · " : "") +
    "Base: " + String(C.fonte).split("/").pop() + ", rodada " + C.rodada + ", " + data(C.atualizado) + ". Reais de 2024 a 2026, sem desconto.";

  // o endereço guarda a aba e a ficha (?vista=…&item=…); os endereços antigos (#residente, #pagador, #premissas) continuam valendo
  var q = new URLSearchParams(location.search);
  abre(q.get("vista") || (location.hash || "").replace("#", "") || "leitura", q.get("item") || undefined);
})();
</script>
</body>
