<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sistemática Hernia3D</title>
<meta name="description" content="A curva sai do centro cirúrgico: o curso de maestria em TAPP em nove abas. O panorama (os 3Ps, quem sustenta e quem ganha, o método que torna seguro), a âncora, as quatro áreas na ordem em que se escoram (como, o que, quem e quanto) e a síntese do que falta definir para virar negócio.">
<meta name="publicacao" content="16|2026-11-06">
<meta property="og:type" content="website">
<meta property="og:title" content="Sistemática Hernia3D · a curva sai do centro cirúrgico">
<meta property="og:description" content="O curso de maestria em TAPP em nove abas: o panorama, a âncora, as quatro áreas na ordem em que se escoram (como, o que, quem e quanto) e a síntese do que falta definir para virar negócio.">
<meta property="og:image" content="https://biodesignbrasil.github.io/hernia3d-site/sistematica/img/og_curva.png">
<meta property="og:url" content="https://biodesignbrasil.github.io/hernia3d-site/sistematica/">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400;1,8..60,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css?v=pub-16">
</head>
<body>

<!-- uma barra só, e ela é o mapa do site: três abas de panorama, a âncora (por que a ordem é esta), as quatro áreas
     numeradas na ordem em que se escoram (como, o que, quem, quanto) e a síntese. As outras duas peças do site entram
     pelas abas 2 e 4 -->
<nav class="barra">
  <a class="brand" href="./"><span class="brand-mark" aria-hidden="true">H³D</span><span class="wm-nome">Sistemática<small><span class="wm-marca">Hernia3D · </span>curso de maestria em TAPP</small></span></a>
  <div class="nav-links" id="camadas" role="tablist" aria-label="as nove abas: o panorama, a âncora, as quatro áreas na ordem em que se escoram, e a síntese"></div>
</nav>

<main class="palco">
  <!-- a pergunta e a manchete da aba. Nas abas que mostram outra peça por dentro (3ª e 4ª), à direita fica o botão que
       a abre. Os dois links ficam escritos aqui, com o endereço do vault: na publicação, o publicador os troca pelos do
       site; o script mostra o da aba aberta e acrescenta o passo escolhido. Abrem na mesma aba do navegador: cada
       site tem o botão que volta à aba de onde se saiu, no passo aberto. O do caso econômico é o único atalho para o painel -->
  <div class="topo">
    <div class="topo-txt">
      <h1 class="pergunta" id="pergunta"></h1>
      <h2 class="manchete" id="manchete"></h2>
    </div>
    <a class="pd-abre" id="porta-plataforma" href="../" data-irma hidden><span id="porta-plataforma-botao">abrir a plataforma</span> →</a>
    <a class="pd-abre" id="porta-economico" href="../caso-economico/" data-painel hidden><span id="porta-economico-botao">abrir o caso econômico</span> →</a>
  </div>
  <!-- o leitor de tela ouve só o título da ficha que abre, e não a leitura inteira -->
  <p class="so-leitor" id="anuncio" aria-live="polite"></p>

  <div class="vistas">
    <section class="vista v-dupla" id="v-abertura" role="tabpanel" aria-label="Abertura">
      <div class="cena"><svg id="ps" viewBox="0 0 900 470" role="group" aria-label="Os 3Ps em três degraus: preparar e praticar no modelo, o critério de maestria, proceder no paciente"></svg></div>
      <aside class="leitura" id="leitura-abe" data-cresce="1.2"></aside>
    </section>

    <section class="vista v-dupla" id="v-ecossistema" role="tabpanel" aria-label="Ecossistema">
      <div class="cena"><svg id="eco" viewBox="0 0 900 530" role="group" aria-label="Quem sustenta o curso, o curso, e quem ganha com ele"></svg></div>
      <aside class="leitura" id="leitura-eco" data-cresce="1.2"></aside>
    </section>

    <section class="vista v-dupla cheia" id="v-sistema" role="tabpanel" aria-label="Sistema">
      <div class="cena">
        <div class="tempos-linha">
          <button type="button" class="volta-duo" data-volta>← os dois olhares, lado a lado</button>
          <div class="tempos" id="tempos" role="tablist" aria-label="os dois olhares"></div>
        </div>
        <!-- a ordem aqui é a da leitura e a do Tab: os dois desenhos, depois a dobradiça, que fecha a comparação.
             No desktop, o CSS põe a dobradiça entre os dois; empilhada, cada desenho ganha o nome do olhar em cima -->
        <div class="duo" id="duo" aria-label="os dois olhares, lado a lado">
          <p class="duo-rot" aria-hidden="true">Olhar 1 · hoje, ver um, fazer um</p>
          <svg id="sis1" viewBox="0 0 900 470" preserveAspectRatio="xMidYMid meet" role="group" aria-label="Hoje, ver um, fazer um: nenhuma operação antes do paciente, a entrada sem critério, e o erro acontece no paciente"></svg>
          <p class="duo-rot" aria-hidden="true">Olhar 2 · com o Hernia3D, os 3Ps</p>
          <svg id="sis2" viewBox="0 0 900 470" preserveAspectRatio="xMidYMid meet" role="group" aria-label="Com o Hernia3D, os 3Ps: preparar e praticar no modelo, o critério de maestria, proceder no paciente; o erro acontece no modelo"></svg>
          <div class="dobradica" id="dobradica"></div>
        </div>
        <svg id="curva" viewBox="0 0 900 470" role="group" aria-label="O método, no olhar em foco"></svg>
        <p class="nota-curva" id="nota-curva"></p>
      </div>
      <aside class="leitura" id="leitura-sis"></aside>
    </section>

    <!-- a âncora: por que as áreas vêm nesta ordem. O mesmo quadro da síntese (como, o que e quem em cima; quanto
         embaixo): aqui, com o que cada área vira e do que depende; lá, com as travas de cada uma -->
    <section class="vista v-ancora" id="v-ancora" role="tabpanel" aria-label="A âncora">
      <div class="painel" id="ancora" data-piso="0.55" data-cresce="1.35"></div>
    </section>

    <!-- 2 · o que: o portfólio, as três ofertas e o que cada uma entrega -->
    <section class="vista v-cheia" id="v-servicos" role="tabpanel" aria-label="O que: o portfólio">
      <div class="painel" id="portfolio" data-cresce="1.5"></div>
    </section>

    <!-- 3ª · quem: a plataforma do residente por dentro, estação por estação, e quem pode comprar. O botão que a abre
         fica ao lado do subtítulo, no alto -->
    <section class="vista v-cheia" id="v-plataforma" role="tabpanel" aria-label="Quem: o residente, na plataforma">
      <div class="painel" id="peca-plataforma" data-piso="0.55" data-cresce="1.3"></div>
    </section>

    <!-- 1 · como: a operação, etapa por etapa (o blueprint: o que o residente vive e, abaixo da linha, o que roda por trás) -->
    <section class="vista v-jornadas" id="v-jornadas" role="tabpanel" aria-label="Como: a operação">
      <div class="painel" id="blueprint" data-cresce="1.5"></div>
    </section>

    <!-- 4ª · quanto: o caso econômico por dentro, passo a passo: o próprio painel numa moldura, com a leitura ao lado. É a
         única parte desta peça que mostra valores em reais. O botão que abre o painel fica ao lado do subtítulo, no alto -->
    <section class="vista v-cheia" id="v-economico" role="tabpanel" aria-label="Quanto: o caso econômico">
      <div class="painel" id="peca-economico" data-piso="0.55" data-cresce="1.3"></div>
    </section>

    <!-- a síntese: o BMC macro em quatro áreas, com as travas de cada uma; os nove blocos ficam um clique abaixo -->
    <section class="vista v-direcao" id="v-direcao" role="tabpanel" aria-label="Síntese">
      <div class="painel" id="direcao" data-piso="0.55" data-cresce="1.25"></div>
    </section>
  </div>

  <p class="legenda-procedencia">
    <span class="lp lp-ok">confirmado</span>
    <span class="lp lp-prov">provável, ou leitura nossa</span>
    <span class="lp lp-aberto">em aberto, ou a confirmar</span>
  </p>
</main>

<script src="js/data.js?v=pub-16"></script>
<script src="js/script.js?v=pub-16"></script>
</body>
</html>
