<!-- uma barra só, no molde das Sistemáticas irmãs: a marca, as abas como pílulas, o atalho para a peça irmã -->
<nav class="barra">
  <a class="brand" href="./"><span class="brand-mark" aria-hidden="true">H³D</span><span class="wm-nome">Sistemática<small>Hernia3D · curso de maestria em TAPP</small></span></a>
  <div class="nav-links" id="camadas" role="tablist" aria-label="a abertura, as quatro camadas e a direção"></div>
  <a class="nav-irma" href="../" data-irma>
    <span class="irma-mark" aria-hidden="true">H³D</span><span>Plataforma do <b>residente</b></span>
  </a>
</nav>

<main class="palco">
  <p class="pergunta" id="pergunta"></p>
  <p class="manchete" id="manchete"></p>

  <div class="vistas">
    <section class="vista v-dupla" id="v-abertura" role="tabpanel" aria-label="Abertura">
      <div class="cena"><svg id="ps" viewBox="0 0 900 470" role="img" aria-label="Os 3Ps em três degraus: preparar e praticar no modelo, a porta da maestria, proceder no paciente"></svg></div>
      <aside class="leitura" id="leitura-abe" aria-live="polite"></aside>
    </section>

    <section class="vista v-dupla" id="v-ecossistema" role="tabpanel" aria-label="Ecossistema">
      <div class="cena"><svg id="eco" viewBox="0 0 900 530" role="img" aria-label="Quem sustenta o curso, o curso, e quem ganha com ele"></svg></div>
      <aside class="leitura" id="leitura-eco" aria-live="polite"></aside>
    </section>

    <section class="vista v-dupla cheia" id="v-sistema" role="tabpanel" aria-label="Sistema">
      <div class="cena">
        <div class="tempos" id="tempos" role="tablist" aria-label="os dois olhares"></div>
        <div class="duo" id="duo" aria-label="os dois olhares, lado a lado">
          <svg id="sis1" viewBox="0 0 900 530" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Hoje, no paciente: a subida inteira acontece no paciente"></svg>
          <div class="dobradica" id="dobradica"></div>
          <svg id="sis2" viewBox="0 0 900 530" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Com o Hernia3D, no modelo: a parte íngreme fica no modelo, em três passos"></svg>
        </div>
        <svg id="curva" viewBox="0 0 900 530" role="img" aria-label="A curva de aprendizado do TAPP, no olhar em foco"></svg>
      </div>
      <aside class="leitura" id="leitura-sis" aria-live="polite"></aside>
    </section>

    <section class="vista v-cheia" id="v-servicos" role="tabpanel" aria-label="Serviços">
      <div class="painel" id="portfolio" data-cresce="1.3"></div>
    </section>

    <section class="vista v-jornadas" id="v-jornadas" role="tabpanel" aria-label="Jornadas">
      <div class="painel" id="blueprint" data-cresce="1.25"></div>
    </section>

    <section class="vista v-direcao" id="v-direcao" role="tabpanel" aria-label="Direção">
      <div class="painel" id="direcao" data-piso="0.55"></div>
    </section>
  </div>

  <p class="legenda-procedencia">
    <span class="lp lp-ok">confirmado</span>
    <span class="lp lp-prov">provável, ou leitura nossa</span>
    <span class="lp lp-aberto">em aberto, ou a confirmar</span>
    <span class="lp-fonte" id="carimbo">Base: vault do projeto Hernia3D. Sem valores em reais nesta peça.</span>
  </p>
