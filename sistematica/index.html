<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sistemática Hernia3D</title>
<meta name="description" content="A curva sai do centro cirúrgico: o curso de maestria em TAPP em seis abas. Os 3Ps, quem sustenta e quem ganha, a curva de aprendizado, o que se oferece, o que o residente vive e o que falta definir para virar negócio.">
<meta name="publicacao" content="8|2026-11-03">
<meta property="og:type" content="website">
<meta property="og:title" content="Sistemática Hernia3D · a curva sai do centro cirúrgico">
<meta property="og:description" content="O curso de maestria em TAPP em seis abas: os 3Ps, quem sustenta e quem ganha, a curva de aprendizado, o que se oferece, o que se vive e o que falta definir para virar negócio.">
<meta property="og:image" content="https://biodesignbrasil.github.io/hernia3d-site/sistematica/img/og_curva.png">
<meta property="og:url" content="https://biodesignbrasil.github.io/hernia3d-site/sistematica/">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400;1,8..60,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css?v=pub-8">
</head>
<body>

<!-- uma barra só, no molde das Sistemáticas irmãs: a marca, as abas como pílulas, o atalho para a peça irmã -->
<nav class="barra">
  <a class="brand" href="./"><span class="brand-mark" aria-hidden="true">H³D</span><span class="wm-nome">Sistemática<small><span class="wm-marca">Hernia3D · </span>curso de maestria em TAPP</small></span></a>
  <div class="nav-links" id="camadas" role="tablist" aria-label="as seis abas, da abertura à direção"></div>
  <a class="nav-irma" href="../" data-irma aria-label="Plataforma do residente">
    <span class="irma-mark" aria-hidden="true">H³D</span><span>Plataforma<span class="irma-do"> do <b>residente</b></span></span>
  </a>
</nav>

<main class="palco">
  <h1 class="pergunta" id="pergunta"></h1>
  <h2 class="manchete" id="manchete"></h2>
  <!-- o leitor de tela ouve só o título da ficha que abre, e não a leitura inteira -->
  <p class="so-leitor" id="anuncio" aria-live="polite"></p>

  <div class="vistas">
    <section class="vista v-dupla" id="v-abertura" role="tabpanel" aria-label="Abertura">
      <div class="cena"><svg id="ps" viewBox="0 0 900 470" role="group" aria-label="Os 3Ps em três degraus: preparar e praticar no modelo, o critério de maestria, proceder no paciente"></svg></div>
      <aside class="leitura" id="leitura-abe" data-cresce="1.2"></aside>
    </section>

    <section class="vista v-dupla" id="v-ecossistema" role="tabpanel" aria-label="Ecossistema">
      <div class="cena"><svg id="eco" viewBox="0 0 900 530" role="group" aria-label="Quem sustenta o curso, o curso, e quem ganha com ele"></svg></div>
      <aside class="leitura" id="leitura-eco" data-cresce="1.2"></aside>
    </section>

    <section class="vista v-dupla cheia" id="v-sistema" role="tabpanel" aria-label="Sistema">
      <div class="cena">
        <div class="tempos-linha">
          <button type="button" class="volta-duo" data-volta>← os dois olhares, lado a lado</button>
          <div class="tempos" id="tempos" role="tablist" aria-label="os dois olhares"></div>
        </div>
        <!-- a ordem aqui é a da leitura e a do Tab: os dois desenhos, depois a dobradiça, que fecha a comparação.
             No desktop, o CSS põe a dobradiça entre os dois; empilhada, cada desenho ganha o nome do olhar em cima -->
        <div class="duo" id="duo" aria-label="os dois olhares, lado a lado">
          <p class="duo-rot" aria-hidden="true">Olhar 1 · hoje, no paciente</p>
          <svg id="sis1" viewBox="0 0 900 470" preserveAspectRatio="xMidYMid meet" role="group" aria-label="Hoje, no paciente: a subida inteira acontece no paciente"></svg>
          <p class="duo-rot" aria-hidden="true">Olhar 2 · com o Hernia3D, no modelo</p>
          <svg id="sis2" viewBox="0 0 900 470" preserveAspectRatio="xMidYMid meet" role="group" aria-label="Com o Hernia3D, no modelo: a parte íngreme fica no modelo, em três passos"></svg>
          <div class="dobradica" id="dobradica"></div>
        </div>
        <svg id="curva" viewBox="0 0 900 470" role="group" aria-label="A curva de aprendizado do TAPP, no olhar em foco"></svg>
        <p class="nota-curva" id="nota-curva"></p>
      </div>
      <aside class="leitura" id="leitura-sis"></aside>
    </section>

    <section class="vista v-cheia" id="v-servicos" role="tabpanel" aria-label="Serviços">
      <div class="painel" id="portfolio" data-cresce="1.5"></div>
    </section>

    <section class="vista v-jornadas" id="v-jornadas" role="tabpanel" aria-label="Jornadas">
      <div class="painel" id="blueprint" data-cresce="1.5"></div>
    </section>

    <section class="vista v-direcao" id="v-direcao" role="tabpanel" aria-label="Direção">
      <div class="painel" id="direcao" data-piso="0.55" data-cresce="1.25"></div>
    </section>
  </div>

  <p class="legenda-procedencia">
    <span class="lp lp-ok">confirmado</span>
    <span class="lp lp-prov">provável, ou leitura nossa</span>
    <span class="lp lp-aberto">em aberto, ou a confirmar</span>
    <span class="lp-fonte" id="carimbo">Base: vault do projeto Hernia3D. Sem valores em reais nesta peça.</span>
  </p>
</main>

<script src="js/data.js?v=pub-8"></script>
<script src="js/script.js?v=pub-8"></script>
</body>
</html>
